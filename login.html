<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover">
    <title>Sign In · The Daily Dough | Artisan Bakery & Cake Shop</title>
    
    <!-- Favicon (cupcake from original) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='78' font-size='78' text-anchor='middle'%3E🧁%3C/text%3E%3C/svg%3E">

    <!-- Tailwind CSS -->
    <script src="tailwind.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'bakery': '#D97A4A',
                        'bakery-dark': '#B45F3A',
                        'bakery-light': '#F0C9A0',
                        'bakery-glow': '#F7D9B0',
                        'cream': '#FEF7F0',
                        'canvas-light': '#FDF8F2',
                        'canvas-dark': '#1E1A17',
                    },
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                        'display': ['Syne', 'sans-serif'],
                        'mono': ['Space Mono', 'monospace'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'float': 'float 6s ease-in-out infinite',
                        'spin-slow': 'spinSlow 10s linear infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-6px)' } },
                        spinSlow: { '0%': { transform: 'rotate(0deg)' }, '100%': { transform: 'rotate(360deg)' } },
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Syne:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        /* ----- NO SCROLL — fit exactly one screen ----- */
        html, body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body, input, button, select, textarea {
            font-family: 'Inter', system-ui, sans-serif;
        }

        .font-display {
            font-family: 'Syne', sans-serif !important;
        }

        .font-mono {
            font-family: 'Space Mono', monospace;
        }

        body {
            background-color: #FDF8F2;
            color: #1E1A17;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .dark body {
            background-color: #1E1A17;
            color: #FDF8F2;
        }

        /* Dark mode text overrides */
        .dark .text-dusk { color: #9CA3AF; }
        .dark input, .dark select, .dark textarea { color: #FFFFFF !important; }

        /* toggle buttons — positioned top-right */
        .theme-toggle-wrapper {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 1000;
            display: flex;
            gap: 6px;
        }

        .toggle-btn {
            width: 36px;
            height: 36px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: white;
            color: #D97A4A;
            transition: all 0.2s ease;
            border: 1px solid rgba(217, 122, 74, 0.25);
            cursor: pointer;
            font-size: 0.9rem;
        }

        .dark .toggle-btn {
            background: #2A2520;
            color: #D97A4A;
            border-color: rgba(217, 122, 74, 0.3);
        }

        .toggle-btn:hover {
            background: #D97A4A;
            color: white;
        }

        .dark .toggle-btn:hover {
            background: #D97A4A;
            color: #1E1A17;
        }

        .toggle-btn.active {
            background: #D97A4A;
            color: white;
        }

        .dark .toggle-btn.active {
            background: #D97A4A;
            color: #1E1A17;
        }

        /* LOGIN CARD */
        .login-card {
            background: white;
            border-radius: 36px;
            padding: 2.2rem 2rem 2rem;
            box-shadow: 0 20px 45px rgba(217, 122, 74, 0.12);
            border: 1px solid rgba(217, 122, 74, 0.2);
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
        }

        .dark .login-card {
            background: #241E1A;
            border-color: rgba(217, 122, 74, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        /* input styling */
        .login-input {
            width: 100%;
            padding: 0.85rem 1.2rem 0.85rem 3rem;
            border-radius: 50px;
            border: 1px solid #E8E4DF;
            background: white;
            font-size: 0.95rem;
            transition: all 0.2s;
            color: #1E1A17;
        }

        .dark .login-input {
            background: #1E1A17;
            border-color: #4A485C;
            color: #FDF8F2;
        }

        .login-input:focus {
            outline: none;
            border-color: #D97A4A;
            box-shadow: 0 0 0 3px rgba(217, 122, 74, 0.2);
        }

        .dark .login-input:focus {
            border-color: #D97A4A;
            box-shadow: 0 0 0 3px rgba(217, 122, 74, 0.25);
        }

        /* password wrapper */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper .login-input {
            padding-right: 3rem;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #D97A4A;
            font-size: 1rem;
            transition: color 0.2s;
            background: transparent;
            border: none;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dark .toggle-password { color: #D97A4A; }
        .toggle-password:hover { color: #B45F3A; }

        [dir="rtl"] .toggle-password {
            right: auto;
            left: 1rem;
        }

        [dir="rtl"] .password-wrapper .login-input {
            padding-right: 1.2rem;
            padding-left: 3rem;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }

        /* primary button */
        .scoop-btn {
            background: #D97A4A;
            color: white;
            font-weight: 600;
            padding: 0.8rem 1.8rem;
            border-radius: 50px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            font-size: 1rem;
            border: none;
            cursor: pointer;
        }

        .scoop-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(217, 122, 74, 0.35);
            background: #B45F3A;
        }

        /* social login buttons */
        .social-btn-row {
            display: flex;
            gap: 1rem;
            width: 100%;
        }

        .social-btn {
            flex: 1;
            padding: 0.8rem 0.5rem;
            border-radius: 50px;
            border: 1px solid #E8E4DF;
            background: white;
            color: #1E1A17;
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            gap: 0.5rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .dark .social-btn {
            background: #1E1A17;
            border-color: #4A485C;
            color: #FDF8F2;
        }

        .social-btn:hover {
            background: #FDF8F2;
            border-color: #D97A4A;
            transform: translateY(-2px);
        }

        .dark .social-btn:hover {
            background: #4A485C;
            border-color: #D97A4A;
        }

        .social-btn i {
            font-size: 1.1rem;
            color: #D97A4A;
        }

        /* logo container */
        .logo-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .brand-logo {
            background: #D97A4A;
            width: 36px;
            height: 36px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0;
            box-shadow: 0 4px 10px rgba(217, 122, 74, 0.2);
            transition: all 0.3s ease;
        }

        @media (min-width: 768px) {
            .brand-logo { width: 40px; height: 40px; }
        }

        .welcome-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1E1A17;
            margin-top: 1.75rem;
            margin-bottom: 0.25rem;
            text-align: center;
            line-height: 1.2;
        }

        .dark .welcome-title { color: #FFFFFF; }

        .welcome-subtitle {
            font-size: 0.9rem;
            color: #1E1A17;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .dark .welcome-subtitle { color: #FDF8F2; }

        /* RTL adjustments */
        [dir="rtl"] .login-input {
            padding: 0.85rem 3rem 0.85rem 1.2rem;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }

        [dir="rtl"] .fa-arrow-right {
            transform: scaleX(-1);
        }

        [dir="rtl"] .theme-toggle-wrapper {
            right: auto;
            left: 20px;
        }

        /* Responsive */
        @media (max-height: 650px) {
            .login-card {
                padding: 0.8rem 1.5rem;
                transform: scale(0.95);
                transform-origin: center;
            }
            .logo-center { margin-bottom: 0.75rem; }
            .welcome-title { font-size: 1.3rem; margin-top: 0.85rem; margin-bottom: 0.25rem; }
            .welcome-subtitle { font-size: 0.8rem; margin-bottom: 0.5rem; }
            .login-input { padding: 0.6rem 0.8rem 0.6rem 2.5rem; font-size: 0.85rem; }
            .scoop-btn { padding: 0.6rem 1rem; font-size: 0.9rem; margin-top: 0.25rem; }
            .theme-toggle-wrapper { top: 8px; right: 8px; }
            .toggle-btn { width: 32px; height: 32px; font-size: 0.8rem; }
        }

        @media (max-width: 380px) {
            .login-card { padding: 1.5rem 1.2rem; border-radius: 24px; }
            .logo-center { margin-bottom: 1rem; }
            .welcome-title { font-size: 1.3rem; }
            .login-input { padding: 0.7rem 1rem 0.7rem 2.8rem; font-size: 0.85rem; }
            .scoop-btn { padding: 0.7rem 1.5rem; font-size: 0.95rem; }
        }

        @media (max-width: 480px) {
            .theme-toggle-wrapper { top: 12px; right: 12px; }
            [dir="rtl"] .theme-toggle-wrapper { left: 12px; }
        }

        .container-tight {
            max-width: 480px;
            width: 100%;
            padding: 0 1.5rem;
        }

        .text-bakery { color: #D97A4A; }
        .hover\:text-bakery-dark:hover { color: #B45F3A; }
        a { transition: all 0.2s ease; }

        .brand-text {
            font-family: 'Syne', sans-serif;
        }
    </style>
</head>

<body>

    <!-- ===== THEME TOGGLES - TOP-RIGHT ===== -->
    <div class="fixed top-4 right-4 z-50 flex items-center gap-3 rtl:right-auto rtl:left-4">
        <button id="theme-toggle" class="toggle-btn" title="Toggle theme"><i class="fas fa-moon"></i><i class="fas fa-sun hidden"></i></button>
        <button id="rtl-toggle" class="toggle-btn" title="Toggle RTL">⇄</button>
    </div>

    <!-- ===== LOGIN CARD ===== -->
    <div class="container-tight">
        <div class="login-card animate-fade-in">

            <!-- ===== LOGO - CENTERED ===== -->
            <div class="logo-center mb-6">
                <a href="index.html" class="inline-flex justify-center items-center group">
                    <div class="bg-white dark:bg-[#1E1A17] px-5 py-2.5 rounded-full flex items-center shadow-md border border-bakery/25 group-hover:border-bakery transition-all duration-300 gap-3">
                        <div class="w-8 h-8 rounded-full bg-bakery/15 dark:bg-bakery/25 flex items-center justify-center text-bakery dark:text-bakery-light text-xs shrink-0">
                            <i class="fas fa-bread-slice"></i>
                        </div>
                        <span class="text-base md:text-lg font-sans font-bold text-gray-900 dark:text-white tracking-tight whitespace-nowrap" style="font-family: 'Inter', system-ui, sans-serif !important;">The Daily <span class="text-bakery">Dough</span></span>
                    </div>
                </a>

                <h1 class="welcome-title" style="font-family: 'Inter', system-ui, sans-serif !important;">Welcome Back, Baker</h1>
                <p class="welcome-subtitle">Sign in to order your favorite pastries &amp; save your preferences</p>
            </div>

            <!-- ===== LOGIN FORM ===== -->
            <form id="loginForm" class="space-y-5" action="#" method="GET">

                <!-- email field -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-bakery input-icon">
                        <i class="fas fa-envelope w-5 text-sm"></i>
                    </span>
                    <input type="email" name="email" id="login-email" placeholder="Email address" required
                        class="login-input text-sm md:text-base">
                </div>

                <!-- password field with eye icon -->
                <div class="password-wrapper">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-bakery input-icon">
                        <i class="fas fa-lock w-5 text-sm"></i>
                    </span>
                    <input type="password" id="login-password" name="password" placeholder="Password" required
                        class="login-input text-sm md:text-base">
                    <button type="button" class="toggle-password" data-target="login-password"
                        aria-label="Show password">
                        <i class="far fa-eye-slash"></i>
                    </button>
                </div>

                <!-- remember + forgot -->
                <div class="flex items-center justify-between text-xs md:text-sm">
                    <label class="flex items-center space-x-2 rtl:space-x-reverse cursor-pointer text-[#1E1A17] dark:text-white">
                        <input type="checkbox"
                            class="rounded border-gray-300 dark:border-gray-600 text-bakery focus:ring-bakery/30 dark:bg-gray-700"
                            checked>
                        <span class="ml-1 rtl:mr-1">Remember me</span>
                    </label>
                    <a href="#" id="forgotPasswordLink"
                        class="text-[#1E1A17] dark:text-white hover:text-bakery font-medium transition hover:underline">
                        Forgot password?
                    </a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="scoop-btn mt-3">
                    Sign In
                </button>

                <!-- divider -->
                <div class="relative my-4">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-[#E8E4DF] dark:border-gray-700"></div>
                    </div>
                    <div class="relative justify-center flex text-xs">
                        <span class="bg-white dark:bg-[#241E1A] px-4 py-0.5 text-[#1E1A17] dark:text-white rounded-full">
                            or continue with
                        </span>
                    </div>
                </div>

            </form>

            <!-- ===== SOCIAL LOGIN BUTTONS ===== -->
            <div class="mt-6">
                <div class="grid grid-cols-2 gap-3">
                    <button class="social-btn group w-full flex items-center justify-center gap-2 py-3 px-2 text-sm"
                        onclick="socialLogin('google')">
                        <i class="fab fa-google text-base"></i>
                        <span>Google</span>
                    </button>
                    <button class="social-btn group w-full flex items-center justify-center gap-2 py-3 px-2 text-sm"
                        onclick="socialLogin('apple')">
                        <i class="fab fa-apple text-base"></i>
                        <span>Apple</span>
                    </button>
                </div>
            </div>

            <!-- ===== "NOT A MEMBER? SIGN UP" LINK ===== -->
            <div class="text-center mt-6 pt-4 border-t border-dashed border-[#E8E4DF] dark:border-gray-700/40">
                <p class="text-sm md:text-base font-semibold text-[#1E1A17] dark:text-white">
                    New to The Daily Dough? 
                    <a href="signup.html" class="text-bakery dark:text-bakery hover:text-bakery-dark font-bold transition ml-1 rtl:mr-1 hover:underline">Sign Up</a>
                </p>
            </div>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script>
        (function () {
            // ---------- THEME TOGGLE ----------
            const themeBtn = document.getElementById('theme-toggle');
            const updateThemeUI = (isDark) => {
                if (themeBtn) {
                    const moon = themeBtn.querySelector('.fa-moon');
                    const sun = themeBtn.querySelector('.fa-sun');
                    if (moon && sun) {
                        if (isDark) { moon.classList.add('hidden'); sun.classList.remove('hidden'); }
                        else { moon.classList.remove('hidden'); sun.classList.add('hidden'); }
                    }
                }
            };
            const toggleTheme = () => {
                document.documentElement.classList.toggle('dark');
                const isDark = document.documentElement.classList.contains('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                updateThemeUI(isDark);
            };
            if (themeBtn) themeBtn.addEventListener('click', (e) => { e.preventDefault(); toggleTheme(); });
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark');
                updateThemeUI(true);
            }

            // ---------- RTL TOGGLE ----------
            const rtlBtn = document.getElementById('rtl-toggle');
            const updateRtlUI = (isRtl) => {
                const dir = isRtl ? 'rtl' : 'ltr';
                document.documentElement.dir = dir;
                document.body.dir = dir;
                if (rtlBtn) rtlBtn.classList.toggle('active', isRtl);
            };
            const toggleRtl = () => {
                const isRtl = document.documentElement.dir !== 'rtl';
                localStorage.setItem('dir', isRtl ? 'rtl' : 'ltr');
                updateRtlUI(isRtl);
            };
            if (rtlBtn) rtlBtn.addEventListener('click', (e) => { e.preventDefault(); toggleRtl(); });
            if (localStorage.getItem('dir') === 'rtl') updateRtlUI(true);

            // ---------- EYE ICON TOGGLE PASSWORD VISIBILITY ----------
            const toggleButtons = document.querySelectorAll('.toggle-password');
            toggleButtons.forEach(button => {
                button.addEventListener('click', function (e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('data-target');
                    const passwordInput = document.getElementById(targetId);
                    if (passwordInput) {
                        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                        passwordInput.setAttribute('type', type);
                        const icon = this.querySelector('i');
                        if (icon) {
                            if (type === 'text') {
                                icon.classList.remove('fa-eye-slash');
                                icon.classList.add('fa-eye');
                            } else {
                                icon.classList.remove('fa-eye');
                                icon.classList.add('fa-eye-slash');
                            }
                        }
                    }
                });
            });

            // ---------- FORGOT PASSWORD HANDLER ----------
            const forgotLink = document.getElementById('forgotPasswordLink');
            if (forgotLink) {
                forgotLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    alert('🍞 Fresh! A password reset link will be sent to your email. Check your inbox!');
                });
            }

            // ---------- LOGIN FORM HANDLER ----------
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();

                    const email = document.getElementById('login-email')?.value;
                    const password = document.getElementById('login-password')?.value;

                    if (!email || !password) {
                        alert('Please enter both email and password');
                        return;
                    }

                    // Redirect to index.html
                    window.location.href = 'index.html';
                });
            }

            // ---------- SOCIAL LOGIN HANDLER ----------
            window.socialLogin = function (provider) {
                alert(`🥐 ${provider.charAt(0).toUpperCase() + provider.slice(1)} login would be implemented here.\n\n✨ Welcome to The Daily Dough community!`);
            };

        })();
    </script>
</body>
</html>
